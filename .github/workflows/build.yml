name: Build

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        name: Checkout
      - name: Build
        uses: threeal/cmake-action@v2.1.0
        with:
          build-args: --config Release
      - name: Test
        uses: threeal/ctest-action@v1.1.0
        with:
          build-config: Release
          verbose: true
